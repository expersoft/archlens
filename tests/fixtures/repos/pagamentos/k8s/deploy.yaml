x-labels: &labels
  app: pagamentos
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pagamentos
  labels:
    app: pagamentos
spec:
  template:
    spec:
      containers:
        - name: app
          image: ghcr.io/acme/pagamentos:2.1.0
          env:
            - name: KAFKA_BROKERS
              value: kafka:9092
            - name: PEDIDOS_URL
              value: http://pedidos-api:8080
---
apiVersion: v1
kind: Service
metadata:
  name: pagamentos
spec:
  selector:
    app: pagamentos
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pagamentos
spec:
  rules:
    - host: pagamentos.acme.com
      http:
        paths:
          - path: /
            backend:
              service:
                name: pagamentos
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pagamentos-db
spec:
  template:
    spec:
      containers:
        - name: db
          image: postgres:15
